<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The ?v= numbers make browsers fetch new copies after an update; change them when the files change -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Mosaic</title>
  <link rel="stylesheet" href="piStyle.css?v=2026-10-16n">
</head>
<body>
  <!-- Menus for choosing which number and width to show, and whether to fold it; pi.js fills in the options -->
  <div id="viewMenu">
    <label>Show <select id="viewSelect"></select></label>
    <label>Fold <select id="foldSelect"></select></label>
    <label>Pairs <select id="pairSelect"></select></label>
    <label>Counting <select id="rolloverSelect"></select></label>
    <span id="foldInfo"></span>
    <a href="cube.html">3D cube</a>
    <a href="sphere.html">Sphere</a>
    <a href="polygons.html">Polygons</a>
    <button id="aboutButton" type="button" aria-controls="aboutPanel">About</button>
  </div>

  <!-- Plain-English explanation of what's on screen; the page's script fills in the text -->
  <aside id="aboutPanel" hidden>
    <button id="aboutClose" type="button" aria-label="Close">×</button>
    <div id="aboutText"></div>
  </aside>

  <!-- digits.js has the digit formulas; pi.js appends #piContainer to <body>, so it must load after <body> exists -->
  <script src="digits.js?v=2026-10-16n"></script>
  <script src="about.js?v=2026-10-16n"></script>
  <script src="pi.js?v=2026-10-16n"></script>
</body>
</html>
