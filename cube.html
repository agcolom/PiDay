<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The ?v= numbers make browsers fetch new copies after an update; change them when the files change -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Mosaic: 3D cube</title>
  <link rel="stylesheet" href="piStyle.css?v=2026-10-16b">
</head>
<body class="cubePage">
  <!-- cube.js draws the digit cube here; drag to rotate, scroll to zoom -->
  <canvas id="cubeCanvas"></canvas>

  <!-- Controls; cube.js fills in the options -->
  <div id="cubeMenu">
    <label>Number <select id="cubeNumber"></select></label>
    <label>Side <select id="cubeSide"></select></label>
    <label>Start at decimal place <input id="cubeStart" type="number" min="0" max="500000" step="1" value="0"></label>
    <label>Show digits <select id="cubeFrom"></select> to <select id="cubeTo"></select></label>
    <label>Lines <select id="cubeLines"></select></label>
    <label>Lines of <select id="cubeKind"></select></label>
    <label>Counting <select id="cubeRollover"></select></label>
    <a href="index.html">Flat mosaic</a>
    <a href="sphere.html">Sphere</a>
    <button id="aboutButton" type="button" aria-controls="aboutPanel">About</button>
    <div id="cubeSummary"></div>
  </div>
  <!-- Plain-English explanation of what's on screen; the page's script fills in the text -->
  <aside id="aboutPanel" hidden>
    <button id="aboutClose" type="button" aria-label="Close">×</button>
    <div id="aboutText"></div>
  </aside>
  <!-- How often each digit appears in the cube; cube.js draws the chart -->
  <div id="digitPanel"></div>
  <div id="cubeInfo">Drag to rotate, scroll to zoom, hover over a cube for its digit</div>

  <!-- digits.js has the digit formulas used by cube.js -->
  <script src="digits.js?v=2026-10-16b"></script>
  <script src="about.js?v=2026-10-16b"></script>
  <script src="cube.js?v=2026-10-16b"></script>
</body>
</html>
