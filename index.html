<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Mosaic</title>
  <link rel="stylesheet" href="piStyle.css">
</head>
<body>
  <!-- Menus for choosing which number and width to show, and whether to fold it; pi.js fills in the options -->
  <div id="viewMenu">
    <label>Show <select id="viewSelect"></select></label>
    <label>Fold <select id="foldSelect"></select></label>
    <span id="foldInfo"></span>
    <a href="cube.html">3D cube</a>
  </div>

  <!-- digits.js has the digit formulas; pi.js appends #piContainer to <body>, so it must load after <body> exists -->
  <script src="digits.js"></script>
  <script src="pi.js"></script>
</body>
</html>
